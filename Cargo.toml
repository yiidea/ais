[package]
name = "ains"
version = "0.1.0"
edition = "2021"
# 代码里用到 std::io::Error::other（1.74 起稳定），MSRV 由 CI 的 msrv 任务守住。
rust-version = "1.75"
description = "AINS — AI-Native Storage Engine (MVP kernel)"
license = "Apache-2.0"

[features]
default = []
# 测试夹具（FakeDevice / FaultInjector / 一致性检查器）只在开启该 feature 时编译。
# 发布构建中整个模块不存在，因此不会进入公共 API 快照（05 §6 约束 4）。
test-harness = []

[[bin]]
name = "ains-demo"
path = "src/bin/ains-demo.rs"

[dependencies]
# MVP 刻意保持零外部依赖：校验和、WAL 编码、假时钟与同步 executor 均在本仓库实现，
# 以便离线构建并让每个格式细节都可审计。
